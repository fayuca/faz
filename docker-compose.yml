services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: faz
      POSTGRES_USER: faz
      POSTGRES_PASSWORD: faz
    volumes:
      - faz-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faz -d faz"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      BACKEND_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend

volumes:
  faz-data:
